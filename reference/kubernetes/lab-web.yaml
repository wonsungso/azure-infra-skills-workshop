apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-web-content
  namespace: lab
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="ko">
    <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Contoso Shop</title>
    <style>
      *{box-sizing:border-box;margin:0;padding:0}
      body{background:#fff;color:#111;
           font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
           -webkit-font-smoothing:antialiased}
      .promo{background:#111;color:#fff;text-align:center;
             font-size:12px;letter-spacing:.06em;padding:9px}
      header{display:flex;align-items:baseline;gap:26px;
             padding:26px 40px;border-bottom:1px solid #ececec}
      .logo{font-size:19px;font-weight:700;letter-spacing:-.02em}
      .logo em{font-style:normal;font-weight:400;color:#8a8a8a}
      nav{display:flex;gap:20px;font-size:13.5px;color:#555}
      .cart{margin-left:auto;font-size:13px;color:#8a8a8a}
      .hero{padding:64px 40px 52px;max-width:940px}
      .hero p{font-size:clamp(24px,3.4vw,36px);line-height:1.35;
              letter-spacing:-.02em;font-weight:400}
      .hero span{border-bottom:2px solid #111;padding-bottom:2px}
      section.cat{padding:0 40px 62px}
      .cat h2{font-size:15px;font-weight:600;letter-spacing:.02em;
              padding-bottom:14px;border-bottom:1px solid #ececec;margin-bottom:26px}
      .row{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:34px}
      .tile{display:block}
      .art{position:relative;height:190px;border-radius:3px;overflow:hidden}
      .art i{position:absolute;background:#111;display:block}
      .t1{background:#EFEAE2}.t2{background:#E7EDEE}.t3{background:#F1ECF3}
      .t4{background:#EDEFE8}.t5{background:#F3E9E6}.t6{background:#E9EDF3}
      .name{margin-top:13px;font-size:14px;font-weight:500}
      .price{margin-top:3px;font-size:13px;color:#7b7b7b}
      footer{border-top:1px solid #ececec;margin:0 40px;padding:26px 0 54px;
             font-size:12.5px;color:#7b7b7b;line-height:1.9}
      code{background:#f4f4f4;padding:2px 7px;border-radius:3px;color:#111}
    </style>
    </head>
    <body>
    <div class="promo">₩199,000 이상 구매 시 무료 배송</div>

    <header>
      <div class="logo">Contoso <em>Shop</em></div>
      <nav><span>Stuff</span><span>Projects</span><span>About</span></nav>
      <span class="cart">Cart (0)</span>
    </header>

    <div class="hero">
      <p>단순하고 오래 쓰는 물건을 만듭니다.<br>그래서 매일이 조금 더 <span>밝아지도록</span>.</p>
    </div>

    <section class="cat">
      <h2>Lighting</h2>
      <div class="row">
        <div class="tile">
          <div class="art t1">
            <i style="left:calc(50% - 1px);top:34px;width:2px;height:44px"></i>
            <i style="left:calc(50% - 44px);top:78px;width:88px;height:44px;border-radius:88px 88px 0 0"></i>
          </div>
          <div class="name">듄 라이트 DL-12</div>
          <div class="price">₩250,000 부터</div>
        </div>
        <div class="tile">
          <div class="art t2">
            <i style="left:44px;top:38px;width:2px;height:90px"></i>
            <i style="left:44px;top:38px;width:84px;height:2px"></i>
            <i style="left:116px;top:40px;width:24px;height:24px;border-radius:50%"></i>
            <i style="left:30px;top:128px;width:30px;height:3px"></i>
          </div>
          <div class="name">크레인 라이트</div>
          <div class="price">₩310,000 부터</div>
        </div>
        <div class="tile">
          <div class="art t3">
            <i style="left:calc(50% - 52px);top:44px;width:104px;height:52px;border-radius:104px 104px 0 0"></i>
            <i style="left:calc(50% - 7px);top:104px;width:14px;height:14px;border-radius:50%"></i>
          </div>
          <div class="name">스윙 돔 라이트</div>
          <div class="price">₩285,000 부터</div>
        </div>
      </div>
    </section>

    <section class="cat">
      <h2>Objects</h2>
      <div class="row">
        <div class="tile">
          <div class="art t4">
            <i style="left:calc(50% - 40px);top:52px;width:80px;height:80px;border-radius:50%;background:transparent;border:3px solid #111"></i>
            <i style="left:calc(50% - 1px);top:70px;width:2px;height:26px"></i>
            <i style="left:calc(50% - 1px);top:92px;width:24px;height:2px"></i>
          </div>
          <div class="name">워치 클록</div>
          <div class="price">₩150,000</div>
        </div>
        <div class="tile">
          <div class="art t5">
            <i style="left:calc(50% - 11px);top:44px;width:22px;height:90px;border-radius:11px"></i>
            <i style="left:calc(50% - 40px);top:86px;width:29px;height:18px;border-radius:9px 0 0 9px"></i>
            <i style="left:calc(50% - 40px);top:66px;width:18px;height:32px;border-radius:9px 9px 0 0"></i>
            <i style="left:calc(50% + 11px);top:74px;width:29px;height:18px;border-radius:0 9px 9px 0"></i>
            <i style="left:calc(50% + 22px);top:56px;width:18px;height:30px;border-radius:9px 9px 0 0"></i>
          </div>
          <div class="name">캑터스 캐치올</div>
          <div class="price">₩199,000 부터</div>
        </div>
        <div class="tile">
          <div class="art t6">
            <i style="left:calc(50% - 40px);top:58px;width:80px;height:40px;border-radius:0 0 40px 40px"></i>
            <i style="left:calc(50% - 40px);top:54px;width:80px;height:4px"></i>
            <i style="left:calc(50% - 26px);top:126px;width:52px;height:3px"></i>
          </div>
          <div class="name">돔 보울</div>
          <div class="price">₩120,000</div>
        </div>
      </div>
    </section>

    <footer>
      Contoso, Inc. - 커머스팀 신규 서비스<br>
      이 응답을 처리한 Pod <code id="pod">…</code> · namespace <code id="ns">…</code>
      &nbsp;|&nbsp; PostgreSQL 상품 <code id="db">조회 중</code>
    </footer>

    <script>
      const fill = async (file, id) => {
        const el = document.getElementById(id);
        try {
          const res = await fetch(file, {cache: 'no-store'});
          el.textContent = (await res.text()).trim() || '-';
        } catch { el.textContent = '-'; }
      };
      fill('pod-name.txt', 'pod');
      fill('pod-namespace.txt', 'ns');
      fill('data/products.txt', 'db');
    </script>
    </body>
    </html>
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-admin
  namespace: lab
  annotations:
    azure.workload.identity/client-id: __POSTGRES_IDENTITY_CLIENT_ID__
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lab-web
  namespace: lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: lab-web
  template:
    metadata:
      labels:
        app: lab-web
        azure.workload.identity/use: "true"
    spec:
      serviceAccountName: postgres-admin
      nodeSelector:
        kubernetes.azure.com/mode: user
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
      volumes:
        # ConfigMap(상품 페이지)과 Downward API(Pod 정보)를 한 디렉터리로 합쳐 서빙한다.
        - name: web-content
          projected:
            sources:
              - configMap:
                  name: lab-web-content
              - downwardAPI:
                  items:
                    - path: pod-name.txt
                      fieldRef:
                        fieldPath: metadata.name
                    - path: pod-namespace.txt
                      fieldRef:
                        fieldPath: metadata.namespace
        - name: token
          emptyDir:
            medium: Memory
        - name: database-content
          emptyDir: {}
      initContainers:
        - name: get-postgres-token
          image: mcr.microsoft.com/azure-cli:2.77.0
          env:
            - name: AZURE_CONFIG_DIR
              value: /tmp/.azure
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              az login --service-principal \
                --username "$AZURE_CLIENT_ID" \
                --tenant "$AZURE_TENANT_ID" \
                --federated-token "$(cat "$AZURE_FEDERATED_TOKEN_FILE")" \
                --allow-no-subscriptions >/dev/null
              az account get-access-token \
                --resource-type oss-rdbms \
                --query accessToken -o tsv > /token/access-token
          volumeMounts:
            - name: token
              mountPath: /token
        - name: query-postgres
          image: postgres:16-alpine
          env:
            - name: PGHOST
              value: __POSTGRES_HOST__
            - name: PGUSER
              value: __POSTGRES_IDENTITY_NAME__
            - name: PGDATABASE
              value: appdb
            - name: PGSSLMODE
              value: require
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              export PGPASSWORD="$(cat /token/access-token)"
              psql -v ON_ERROR_STOP=1 \
                -c 'CREATE TABLE IF NOT EXISTS products (id integer PRIMARY KEY, name text NOT NULL, price integer NOT NULL);' \
                -c "INSERT INTO products VALUES (1, 'Dune Light DL-12', 250000) ON CONFLICT (id) DO NOTHING;"
              psql -At -F ' · KRW ' \
                -c 'SELECT name, price FROM products ORDER BY id LIMIT 1;' \
                > /database/products.txt
          volumeMounts:
            - name: token
              mountPath: /token
              readOnly: true
            - name: database-content
              mountPath: /database
      containers:
        - name: web
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - containerPort: 8080
          volumeMounts:
            - name: web-content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: database-content
              mountPath: /usr/share/nginx/html/data
              readOnly: true
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /
              port: 8080
          livenessProbe:
            httpGet:
              path: /
              port: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
---
apiVersion: v1
kind: Service
metadata:
  name: lab-web
  namespace: lab
spec:
  type: ClusterIP
  selector:
    app: lab-web
  ports:
    - name: http
      port: 80
      targetPort: 8080
---
apiVersion: batch/v1
kind: Job
metadata:
  name: postgres-check
  namespace: lab
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        azure.workload.identity/use: "true"
    spec:
      restartPolicy: Never
      serviceAccountName: postgres-admin
      volumes:
        - name: token
          emptyDir:
            medium: Memory
      initContainers:
        - name: get-token
          image: mcr.microsoft.com/azure-cli:2.77.0
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              az login --service-principal \
                --username "$AZURE_CLIENT_ID" \
                --tenant "$AZURE_TENANT_ID" \
                --federated-token "$(cat "$AZURE_FEDERATED_TOKEN_FILE")" \
                --allow-no-subscriptions >/dev/null
              az account get-access-token \
                --resource-type oss-rdbms \
                --query accessToken -o tsv > /token/access-token
          volumeMounts:
            - name: token
              mountPath: /token
      containers:
        - name: psql
          image: postgres:16-alpine
          env:
            - name: PGHOST
              value: __POSTGRES_HOST__
            - name: PGUSER
              value: __POSTGRES_IDENTITY_NAME__
            - name: PGDATABASE
              value: appdb
            - name: PGSSLMODE
              value: require
          command:
            - /bin/sh
            - -c
            - |
              set -eu
              export PGPASSWORD="$(cat /token/access-token)"
              psql -v ON_ERROR_STOP=1 \
                -c 'CREATE TABLE IF NOT EXISTS workshop_check (checked_at timestamptz NOT NULL DEFAULT now());' \
                -c 'INSERT INTO workshop_check DEFAULT VALUES;' \
                -c 'SELECT count(*) AS successful_checks FROM workshop_check;'
          volumeMounts:
            - name: token
              mountPath: /token
              readOnly: true
---
apiVersion: alb.networking.azure.io/v1
kind: ApplicationLoadBalancer
metadata:
  name: lab-alb
  namespace: lab
spec:
  associations:
    - __ALB_SUBNET_ID__
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: lab-gateway
  namespace: lab
  annotations:
    alb.networking.azure.io/alb-namespace: lab
    alb.networking.azure.io/alb-name: lab-alb
spec:
  gatewayClassName: azure-alb-external
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: lab-web
  namespace: lab
spec:
  parentRefs:
    - name: lab-gateway
  rules:
    - backendRefs:
        - name: lab-web
          port: 80
