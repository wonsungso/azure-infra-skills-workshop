<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1000" viewBox="0 0 1440 1000" role="img" aria-labelledby="title desc">
  <title id="title">Contoso 신입 플랫폼 엔지니어의 긴급 오픈 미션</title>
  <desc id="desc">입사 직후 Contoso Shop 출시를 일주일 안에 준비하라는 요청을 받았습니다. 시간과 인력이 부족해 GitHub Copilot의 LLM과 Azure Skills로 계획, 배포, 운영 점검, 장애 분석을 진행합니다. 사람은 설계와 변경을 승인하고 실제 HTTP와 SQL 결과를 확인합니다. Lab 01부터 Lab 08까지 설계, 실행, 복구, 인계를 연습하는 교육용 가상 시나리오입니다.</desc>
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#dce3ed"/>
    </pattern>
    <g id="engineer">
      <path d="M29 153 Q34 112 82 113 Q128 114 135 153 L145 193 H19Z" fill="#ccefe7" stroke="#29394b" stroke-width="3"/>
      <path d="M62 112 L62 129 L82 142 L104 127 L104 111" fill="#ffd8b5" stroke="#29394b" stroke-width="3"/>
      <ellipse cx="82" cy="72" rx="40" ry="47" fill="#ffd8b5" stroke="#29394b" stroke-width="3"/>
      <path d="M42 69 Q27 20 77 14 Q117 9 127 49 L119 74 L111 49 Q83 56 62 39 L49 73Z" fill="#29394b"/>
      <path d="M64 70 L70 68 M94 68 L101 70" stroke="#29394b" stroke-width="3" stroke-linecap="round"/>
      <ellipse cx="68" cy="78" rx="3" ry="4" fill="#29394b"/>
      <ellipse cx="98" cy="78" rx="3" ry="4" fill="#29394b"/>
      <path d="M77 99 Q86 106 94 95" fill="none" stroke="#29394b" stroke-width="3" stroke-linecap="round"/>
      <path d="M70 137 L70 168 M97 136 L97 167" fill="none" stroke="#4d8f83" stroke-width="3"/>
      <rect x="73" y="159" width="23" height="26" rx="4" fill="#fff" stroke="#29394b" stroke-width="2"/>
      <path d="M33 152 L19 181 L49 192 M126 152 L145 181 L114 192" fill="none" stroke="#29394b" stroke-width="3" stroke-linecap="round"/>
    </g>
    <g id="laptop">
      <path d="M9 7 H118 L130 77 H20Z" fill="#edf0f7" stroke="#29394b" stroke-width="3" stroke-linejoin="round"/>
      <path d="M20 77 H130 L142 87 H6 L0 82Z" fill="#d7dfec" stroke="#29394b" stroke-width="3" stroke-linejoin="round"/>
      <path d="M48 35 L37 45 L50 55 M85 35 L98 45 L87 55 M73 29 L63 62" fill="none" stroke="#6e65b7" stroke-width="4" stroke-linecap="round"/>
    </g>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8" fill="none" stroke="#8190a7" stroke-width="1.5" stroke-linejoin="round"/>
    </marker>
    <style>
      text {font-family:"Malgun Gothic","Noto Sans KR","Apple SD Gothic Neo",Arial,sans-serif;fill:#172b45}
      .title {font-size:42px;font-weight:800;letter-spacing:-1px}
      .subtitle {font-size:22px;fill:#52647d}
      .cardtitle {font-size:25px;font-weight:800}
      .body {font-size:21px}
      .small {font-size:18px}
      .label {font-size:18px;font-weight:700}
      .center {text-anchor:middle}
      .muted {fill:#52647d}
      .bold {font-weight:700}
      .line {stroke:#29394b;stroke-width:3;fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="1440" height="1000" rx="28" fill="#f6f8fc"/>
  <rect width="1440" height="1000" rx="28" fill="url(#dots)" opacity=".5"/>
  <rect x="34" y="28" width="143" height="36" rx="18" fill="#e4e0f7"/>
  <text x="105" y="53" class="label center">가상 시나리오</text>
  <text x="34" y="121" class="title">입사하자마자, Contoso Shop 오픈 미션!</text>
  <text x="36" y="160" class="subtitle">시간도, 사람도 부족하다면? Copilot과 Azure Skills를 나의 작업 파트너로.</text>
  <rect x="1200" y="42" width="206" height="114" rx="22" fill="#fff0e5" stroke="#e9c5a8" stroke-width="2"/>
  <text x="1303" y="78" class="label center">커머스팀 출시 요청</text>
  <text x="1303" y="128" class="center" style="font-size:40px;font-weight:800;fill:#b64f13">D−7</text>

  <rect x="34" y="200" width="1372" height="62" rx="16" fill="#fff" stroke="#d8e0ec" stroke-width="2"/>
  <text x="60" y="239" class="body"><tspan class="bold">나의 역할</tspan><tspan dx="16">Contoso 신입 플랫폼 엔지니어</tspan></text>
  <path d="M576 217 V246" stroke="#d8e0ec" stroke-width="2"/>
  <text x="605" y="239" class="body"><tspan class="bold">미션</tspan><tspan dx="16">Public Ingress + AKS + Private PostgreSQL 준비</tspan></text>

  <rect x="34" y="292" width="318" height="410" rx="22" fill="#fff" stroke="#a9d7cc" stroke-width="2"/>
  <path d="M56 292 H330 Q352 292 352 314 V365 H34 V314 Q34 292 56 292Z" fill="#daf1e9"/>
  <circle cx="66" cy="329" r="19" fill="#fff"/>
  <text x="66" y="336" class="label center">1</text>
  <text x="98" y="338" class="cardtitle">첫 출근, 첫 미션</text>
  <rect x="56" y="384" width="274" height="61" rx="14" fill="#eff9f5" stroke="#bddfd4" stroke-width="2"/>
  <path d="M106 445 L116 459 L129 445" fill="#eff9f5" stroke="#bddfd4" stroke-width="2"/>
  <text x="193" y="410" class="body center bold">“다음 주에 오픈해요!</text>
  <text x="193" y="435" class="small center">Azure 환경 부탁드려요.”</text>
  <g transform="translate(123 466) scale(.85)"><use href="#engineer"/></g>
  <use href="#laptop" x="119" y="548"/>
  <text x="193" y="672" class="body center bold">요구사항부터 확인!</text>

  <path d="M360 494 H378" stroke="#8190a7" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="386" y="292" width="318" height="410" rx="22" fill="#fff" stroke="#e6c49c" stroke-width="2"/>
  <path d="M408 292 H682 Q704 292 704 314 V365 H386 V314 Q386 292 408 292Z" fill="#fff0dc"/>
  <circle cx="418" cy="329" r="19" fill="#fff"/>
  <text x="418" y="336" class="label center">2</text>
  <text x="450" y="338" class="cardtitle">혼자 다 하기엔…</text>
  <circle cx="548" cy="446" r="54" fill="#fff7ea" stroke="#a57641" stroke-width="3"/>
  <path d="M548 409 V446 L571 458" fill="none" stroke="#a57641" stroke-width="4" stroke-linecap="round"/>
  <path d="M548 391 V399 M603 446 H595 M548 501 V493 M493 446 H501" stroke="#a57641" stroke-width="3"/>
  <rect x="410" y="526" width="270" height="41" rx="11" fill="#fff7ea"/>
  <text x="545" y="554" class="body center">시간 부족 · 인력 부족</text>
  <text x="545" y="600" class="body center">Network · 권한 · 인증</text>
  <text x="545" y="630" class="body center">명령을 하나씩 찾다 보니…</text>
  <text x="545" y="672" class="body center bold">“도와줄 파트너 없을까?”</text>

  <path d="M712 494 H730" stroke="#8190a7" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="738" y="292" width="318" height="410" rx="22" fill="#fff" stroke="#c2b9e5" stroke-width="2"/>
  <path d="M760 292 H1034 Q1056 292 1056 314 V365 H738 V314 Q738 292 760 292Z" fill="#eae6fa"/>
  <circle cx="770" cy="329" r="19" fill="#fff"/>
  <text x="770" y="336" class="label center">3</text>
  <text x="802" y="338" class="cardtitle">자연어로 함께 해결</text>
  <rect x="760" y="385" width="274" height="64" rx="14" fill="#f6f3ff" stroke="#d0c7ea" stroke-width="2"/>
  <text x="897" y="414" class="body center bold">“계획부터 잡아줘.</text>
  <text x="897" y="439" class="small center">승인 전에는 배포하지 마!”</text>
  <rect x="760" y="470" width="274" height="94" rx="16" fill="#f0edfa"/>
  <rect x="778" y="491" width="49" height="40" rx="12" fill="#fff" stroke="#6e65b7" stroke-width="2"/>
  <path d="M802 481 V491 M773 507 H778 M827 507 H832" stroke="#6e65b7" stroke-width="2"/>
  <circle cx="791" cy="507" r="3" fill="#6e65b7"/>
  <circle cx="814" cy="507" r="3" fill="#6e65b7"/>
  <path d="M792 520 H814" stroke="#6e65b7" stroke-width="2" stroke-linecap="round"/>
  <text x="842" y="505" class="label">GitHub Copilot</text>
  <text x="842" y="539" class="small">LLM + Azure Skills</text>
  <text x="897" y="600" class="body center">제안 → 사람의 승인</text>
  <text x="897" y="630" class="body center">→ MCP·CLI로 실행</text>
  <text x="897" y="672" class="body center bold">배포 · 점검 · 원인 분석</text>

  <path d="M1064 494 H1082" stroke="#8190a7" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1090" y="292" width="316" height="410" rx="22" fill="#fff" stroke="#aacbde" stroke-width="2"/>
  <path d="M1112 292 H1384 Q1406 292 1406 314 V365 H1090 V314 Q1090 292 1112 292Z" fill="#e0f0fa"/>
  <circle cx="1122" cy="329" r="19" fill="#fff"/>
  <text x="1122" y="336" class="label center">4</text>
  <text x="1154" y="338" class="cardtitle">오픈 준비 확인!</text>
  <rect x="1115" y="393" width="266" height="148" rx="13" fill="#fff" stroke="#75a6c7" stroke-width="3"/>
  <path d="M1115 422 H1381" stroke="#75a6c7" stroke-width="2"/>
  <circle cx="1132" cy="408" r="4" fill="#bed7e7"/>
  <circle cx="1147" cy="408" r="4" fill="#bed7e7"/>
  <circle cx="1162" cy="408" r="4" fill="#bed7e7"/>
  <text x="1248" y="455" class="body center bold">Contoso Shop</text>
  <rect x="1132" y="474" width="67" height="45" rx="6" fill="#f4ebe0"/>
  <rect x="1214" y="474" width="67" height="45" rx="6" fill="#e5f0f0"/>
  <rect x="1296" y="474" width="67" height="45" rx="6" fill="#eee8f6"/>
  <path d="M1154 501 Q1165 480 1177 501Z M1240 482 V508 H1227 M1316 494 Q1330 479 1344 494" stroke="#52647d" stroke-width="2" fill="none"/>
  <rect x="1115" y="560" width="266" height="43" rx="11" fill="#eaf7f0"/>
  <path d="M1133 581 L1140 588 L1153 574" stroke="#378066" stroke-width="3" fill="none"/>
  <text x="1260" y="589" class="body center">HTTP 200 · SQL 성공</text>
  <text x="1248" y="630" class="body center">장애 원인 확인 · 복구</text>
  <text x="1248" y="672" class="body center bold">근거를 남기고 인계</text>

  <rect x="34" y="734" width="1372" height="178" rx="22" fill="#fff" stroke="#d8e0ec" stroke-width="2"/>
  <text x="60" y="776" class="cardtitle">이번 미션을 따라가는 8개 Lab</text>
  <rect x="60" y="796" width="292" height="84" rx="14" fill="#eff8f4"/>
  <text x="206" y="825" class="label center">Lab 01–02 · 준비와 설계</text>
  <text x="206" y="858" class="body center">환경 · Quota · 권한 결정</text>
  <path d="M365 838 H384" stroke="#8190a7" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="400" y="796" width="292" height="84" rx="14" fill="#f4f0fc"/>
  <text x="546" y="825" class="label center">Lab 03–04 · 계획과 검증</text>
  <text x="546" y="858" class="body center">계획 승인 · IaC · 배포 승인</text>
  <path d="M704 838 H724" stroke="#8190a7" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="740" y="796" width="292" height="84" rx="14" fill="#edf5fc"/>
  <text x="886" y="825" class="label center">Lab 05–06 · 배포와 확인</text>
  <text x="886" y="858" class="body center">AGC → AKS → Private SQL</text>
  <path d="M1044 838 H1064" stroke="#8190a7" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1080" y="796" width="300" height="84" rx="14" fill="#fff5e8"/>
  <text x="1230" y="825" class="label center">Lab 07–08 · 복구와 인계</text>
  <text x="1230" y="858" class="body center">장애 실습(선택) · 문서 · 정리</text>

  <text x="720" y="949" class="body center bold">Copilot은 제안하고 실행합니다. 중요한 결정과 변경 승인은 내가 합니다.</text>
  <text x="720" y="979" class="small center muted">교육용 가상 시나리오 · 앱 코딩 없이 제공된 Manifest 사용 · 실제 Azure 리소스는 과금 발생</text>
</svg>
